<!doctype html>
<html lang="pt-BR" data-theme="dark" data-experience="mensagem-v4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100904">
  <meta name="description" content="Envie um briefing estruturado para iniciar um projeto com o Mensagem Studio.">
  <link rel="stylesheet" href="/assets/v4-fallback.css">
  <link rel="canonical" href="https://example.com/briefing/">
  <title>Briefing — Mensagem Studio</title>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="site-header site-header-v3"><a class="brand" href="/"><strong>MENSAGEM</strong><span>IMMERSIVE V4</span></a><nav class="nav" aria-label="Principal"><a href="/projetos/">Projetos</a><a href="/servicos/">Serviços</a><a href="/briefing/">Briefing</a></nav><div class="header-actions"><button class="icon-button" data-action="theme" aria-label="Alternar tema">◐</button><a class="beam-button compact" href="/#quote">Orçamento</a></div></header>
  <main id="main"><section class="briefing-page-v4"><header><p class="eyebrow">START A PROJECT / BRIEFING</p><h1>Conte o que precisa acontecer.</h1><p>O briefing é separado do orçamento e pode receber automaticamente o serviço ou projeto que trouxe você até aqui.</p></header><section class="panel-form briefing-panel-v4"><form class="quote-form" data-briefing-form><label>Nome<input name="name" autocomplete="name" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Empresa / projeto<input name="company" autocomplete="organization"></label><label>Serviço<select name="service"><option value="">Ainda não sei</option><option value="branding">Branding</option><option value="design">Design</option><option value="motion">Motion</option><option value="3d">3D / CGI</option><option value="web">Web Experience</option></select></label><label class="full">Projeto de referência<input name="sourceProject" placeholder="Preenchido automaticamente ao vir de um case"></label><label class="full">Objetivo<textarea name="objective" rows="5" required placeholder="O que precisa mudar ou acontecer?"></textarea></label><label class="full">Público<textarea name="audience" rows="4" required placeholder="Quem precisa perceber, comprar ou usar?"></textarea></label><label class="full">Referências<textarea name="references" rows="4" placeholder="Links, estética, concorrentes ou caminhos a evitar."></textarea></label><label>Prazo<input name="deadline" placeholder="Ex.: novembro/2026"></label><button class="beam-button" type="submit">Enviar briefing</button><p data-briefing-status role="status"></p></form></section></section></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
